name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate data files
        run: python3 tools/validate.py
      # 警告级守卫：PR 改到维护者自留源（audit/reserved.tsv）只打 ::warning:: 注解，永不失败。
      - name: Reserved-source guard (warning only, never fails)
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}" || true
          python3 tools/audit_queue.py --check-reserved --base "origin/${{ github.base_ref }}" || true
      # 阻断级守卫（2026-11-14 起）：分支必须基于当前契约定版 + 落后不得超过阈值。
      # 背景：2026-11-14 批次的 #911–#922 用 v2.39 的 25 列表头（v2.40 已撤销）、#913/#918/#919
      # 沿用 `Gext_corr=y` 旧语义，全是「分支基线早于契约定版」的机械缺陷（科学内容本身没问题），
      # 只能靠维护者二次打回；另一个维度是「基于三周前 main」（当时 18 个 PR 基于 10-24）。
      # 判据：① head 不含 base 上最近一次改 SCHEMA.md / 数据审核提示词.md / tools/validate.py 的提交
      #       → 契约漂移，红；② 落后 > 400 提交 → 红。400 对应「两三周前」，批次合并后的几百落后不拦。
      # 修法唯一：`git pull --rebase origin main` 后重推。
      - name: Branch freshness vs base (contract baseline + behind count)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: python3 tools/check_branch_freshness.py --strict --max-behind 400
      # 警告级守卫：本 PR 新增线索卡的规模/形态（§3.11 增量门槛 + 文献级卡），永不失败。
      # 只在 PR 里跑：判据是本 PR **新增**的卡，历史欠账（如 Ershova+2020 的 45 张）不刷警告。
      - name: Lead-card guard (warning only, never fails)
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}" || true
          python3 tools/audit_queue.py --check-leads --base "origin/${{ github.base_ref }}" || true
      # 阻断级守卫：同一个源被多个 open PR 同时占用（认领挤占）。
      # 判据是**实时** open PR 状态（含 `claim: <源ID>` 标题），不是每日生成的 audit/state.tsv 快照。
      # 只让**后开者**失败（先开者仍绿）；PR 上另有一条由 collision-comment.yml 发出的可见评论与 `collision` label。
      - name: Duplicate claim guard (later PR fails)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 tools/check_duplicate_claim.py --strict
      # 阻断级守卫：一源一 PR + 改动路径白名单（2026-10-29 新增）。
      # 判据 = 本 PR 的改动文件清单：info/lc 的源集合 >1（#490/#495 那类跨源操作）、或改了
      # filters.json / tools/ 等无关文件（#550）即失败；维护者（OWNER/MEMBER/COLLABORATOR）豁免。
      - name: PR scope guard (one source per PR, allowed paths)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_EVENT_PULL_REQUEST_TITLE: ${{ github.event.pull_request.title }}
          GITHUB_EVENT_PULL_REQUEST_AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
        run: python3 tools/check_pr_scope.py --strict
      # 阻断级守卫：本 PR 改了 T0 就必须让 lc 行 `mjd = T0 + time` 自洽（2026-11-03 新增）。
      # 背景：2026-11-03 批次 23 个改 T0 的 PR 里 8 个把 X 射线块漏在旧历元（整块偏 1.9 s ~ 21 h）。
      # validate.py 对这一族只有警告级，作者普遍不知道「改 T0 要重算」→ 这里变红。
      # 不规定修法：mjd := T0+time（XRT/BA 口径）或 time 随 T0 平移（旧历元口径）都通过。
      # 走 REST API（`--pr`）而不是 git diff：checkout 是 depth=1 的 merge ref，拿不到 merge-base，
      # 两点 diff 会把主分支上别的 PR 的 T0 改动算进来（假阳性）。
      - name: T0 rebase guard (mjd must equal T0 + time)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 tools/check_t0_timebase.py \
            --repo "${{ github.repository }}" \
            --pr "${{ github.event.pull_request.number }}" --strict
