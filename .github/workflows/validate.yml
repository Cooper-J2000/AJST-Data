name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate data files
        run: python3 tools/validate.py
      # 警告级守卫：PR 改到维护者自留源（audit/reserved.tsv）只打 ::warning:: 注解，永不失败。
      - name: Reserved-source guard (warning only, never fails)
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}" || true
          python3 tools/audit_queue.py --check-reserved --base "origin/${{ github.base_ref }}" || true
      # 警告级守卫：本分支落后 base 多少提交，永不失败。
      # 目的：把「这个 PR 有没有 pull 过上游」变成 PR 页面上可见的事实（《数据审核提示词》§2 第 9 条 / §5 第 7 条）。
      - name: Branch freshness vs base (warning only, never fails)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: python3 tools/check_branch_freshness.py
